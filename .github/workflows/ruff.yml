name: Ruff

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    name: Ruff autofix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install ruff
        run: python -m pip install ruff==0.16.8

      - name: Apply fixes
        run: ruff check custom_components tests --select E,W,F --fix --unsafe-fixes

      - name: Commit fixes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Нечего исправлять."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Apply ruff autofixes"
          git push
