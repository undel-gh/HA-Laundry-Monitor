name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Reject tracked Python cache artifacts
        run: |
          tracked="$(git ls-files -- '*.pyc' '*.pyo' '*.pyd' '*__pycache__*')"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked Python cache artifacts must be removed:"
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.8

      - name: Check style without changing files
        run: ruff check custom_components tests --select E,W,F

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate with Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest

    steps:
      - name: Validate with HACS
        uses: hacs/action@main
        with:
          category: integration

  core_tests:
    # The matrix jobs keep stable names across monthly Core version bumps.
    name: Tests (${{ matrix.check_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: minimum
            scope: minimum-smoke
            ha_core: "2026.6.0"
            fixture: "0.13.336"
            requirements: requirements_test_min.txt
          - check_name: current
            scope: current-full
            ha_core: "2026.10.4"
            fixture: "0.13.375"
            requirements: requirements_test.txt

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Install Core-specific test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ${{ matrix.requirements }}
          python -m pip check

      - name: Verify imported Home Assistant and fixture versions
        env:
          EXPECTED_HA: ${{ matrix.ha_core }}
          EXPECTED_FIXTURE: ${{ matrix.fixture }}
        run: |
          python - <<'PY'
          import os
          import sys
          from importlib import metadata

          import homeassistant
          from homeassistant.const import __version__ as imported_core_version

          expected_core = os.environ["EXPECTED_HA"]
          expected_fixture = os.environ["EXPECTED_FIXTURE"]
          installed_core = metadata.version("homeassistant")
          installed_fixture = metadata.version(
              "pytest-homeassistant-custom-component"
          )
          print(f"Python: {sys.version}")
          print(f"Home Assistant imported from: {homeassistant.__file__}")
          print(f"Home Assistant imported Core version: {imported_core_version}")
          print(f"Home Assistant distribution: {installed_core}")
          print(f"Pytest fixture distribution: {installed_fixture}")
          assert imported_core_version == expected_core
          assert installed_core == expected_core
          assert installed_fixture == expected_fixture
          PY

      - name: Check Python syntax
        run: python -m compileall -q custom_components tests

      - name: Minimum Core full regression suite
        if: matrix.scope == 'minimum-smoke'
        run: python -m pytest -vv --tb=short

      - name: Current Core full regression suite
        if: matrix.scope == 'current-full'
        run: python -m pytest -vv --tb=short

  tests:
    # Preserve the pre-existing required status "Tests" in branch protection.
    # A matrix failure must make the aggregate gate fail, not merely skip it.
    name: Tests
    runs-on: ubuntu-latest
    needs: core_tests
    if: always()

    steps:
      - name: Require both supported Core environments to pass
        env:
          CORE_TESTS_RESULT: ${{ needs.core_tests.result }}
        run: |
          echo "Core compatibility matrix result: $CORE_TESTS_RESULT"
          if [ "$CORE_TESTS_RESULT" != "success" ]; then
            echo "::error::One or more Home Assistant Core compatibility jobs failed."
            exit 1
          fi
